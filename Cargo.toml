[workspace]
members = ["crates/kanzi", "crates/kanzi-cli", "crates/kanzi-py"]
# Plain `cargo build` / `cargo test` stay pure Rust: no Python interpreter,
# no pyo3. The extension module is built by maturin (see pyproject.toml),
# or explicitly with `cargo build -p kanzi-py`.
default-members = ["crates/kanzi", "crates/kanzi-cli"]
resolver = "2"

[profile.release]
opt-level = 3
