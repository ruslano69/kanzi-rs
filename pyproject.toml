[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kanzi"
description = "Rust port of the kanzi lossless data compressor, exposed as a Python extension module"
readme = "README.md"
authors = [
    { name = "ruslano69", email = "ruslano69@gmail.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["compression", "lossless", "kanzi", "archiving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Archiving :: Compression",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ruslano69/kanzi-rs"
Repository = "https://github.com/ruslano69/kanzi-rs"
Issues = "https://github.com/ruslano69/kanzi-rs/issues"

[tool.maturin]
# The extension module is its own workspace crate; the codec itself lives in
# crates/kanzi and has no Python dependency.
manifest-path = "crates/kanzi-py/Cargo.toml"
# crates/kanzi-py/Cargo.toml's [lib] name already sets the compiled module
# name to `kanzi`; spelled out here too since it's what `import kanzi` loads.
module-name = "kanzi"
# The sdist is built from crates/kanzi-py, but LICENSE lives at the repo
# root while the wheel METADATA declares it as License-File. Without this
# PyPI rejects the sdist with "400 License-File ... does not exist".
# (Single LICENSE file, like kanzi-go.)
include = [{ path = "LICENSE", format = "sdist" }]
