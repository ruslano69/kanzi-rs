name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo build/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --verbose

      - name: cargo test
        run: cargo test --release --verbose

      # libsais links a small C library; ubuntu-latest has a C toolchain
      # preinstalled, so this is enough to catch a regression in the
      # optional feature without needing it in the full OS matrix.
      - name: cargo build (fast-sa feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --features fast-sa --verbose

  wheels:
    name: wheel + round-trip (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: true

      - name: Install wheel
        shell: bash
        run: pip install --force-reinstall dist/*.whl

      - name: Round-trip regression check (all levels, real files, --strict)
        run: python examples/benchmark.py --strict

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
