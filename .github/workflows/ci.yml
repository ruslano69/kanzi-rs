name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo build/test, pure Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --verbose

      - name: cargo test
        run: cargo test --release --verbose

      # fast-sa (libsais) is a default feature, so the steps above already
      # cover it on every OS; this keeps the pure-Rust suffix array path
      # (divsufsort.rs, used with --no-default-features) building and tested.
      - name: cargo test (pure-Rust suffix array, no fast-sa)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p kanzi --no-default-features --verbose

  wheels:
    name: wheel + round-trip (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: true

      - name: Install wheel
        shell: bash
        run: pip install --force-reinstall dist/*.whl

      - name: Round-trip regression check (all levels, real files, --strict)
        run: python crates/kanzi-py/examples/benchmark.py --strict

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
